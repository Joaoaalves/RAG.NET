<div class="flex flex-col col-start-2 mb-12">
  <header
    class="flex flex-col lg:flex-row md:items-center justify-between gap-4 mb-8 w-full"
  >
    <div>
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">
        Welcome & Usage
      </h1>
      <p class="text-white/60 mt-1">
        Monitor your token balance and track RAG workflow consumption.
      </p>
    </div>
  </header>
  <div class="grid grid-cols-1 gap-8 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div
        class="bg-card text-card-foreground bg-gradient-to-tr from-pink-500/10 to-pink-500/5 border-pink-500/20 border rounded-xl shadow-inner transition-all hover:shadow-lg hover:scale-[1.02] animate-in fade-in slide-in-from-left-4 duration-700"
        data-v0-t="card"
      >
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h3
              class="text-neutral-300 font-semibold text-sm uppercase tracking-wide"
            >
              Free Tokens
            </h3>
            <button data-state="closed">
              <div class="text-xl text-neutral-400">
                <ng-icon name="lucide-info"></ng-icon>
              </div>
            </button>
          </div>
          <div class="text-4xl font-extrabold text-fuchsia-400 mb-2">{{wallet.freeTokens}}</div>
          <div class="text-neutral-400 text-sm">Available tokens</div>
        </div>
      </div>
      <div
        class="bg-card text-card-foreground bg-gradient-to-tr from-sky-500/10 to-sky-500/5 border-sky-500/20 border rounded-xl shadow-inner transition-all hover:shadow-lg hover:scale-[1.02] animate-in fade-in slide-in-from-right-4 duration-700 delay-150"
        data-v0-t="card"
      >
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h3
              class="text-neutral-300 font-semibold text-sm uppercase tracking-wide"
            >
              Paid Tokens
            </h3>
          </div>
          <div class="text-4xl font-extrabold text-sky-400 mb-2">{{wallet.paidTokens}}</div>
          <div class="text-neutral-400 text-sm">Available tokens</div>
        </div>
      </div>
    </div>
  </div>
</div>
