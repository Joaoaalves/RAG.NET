<div class="animate-in fade-in slide-in-from-bottom-4 duration-700 delay-500">
  <div
    class="border text-card-foreground shadow-sm bg-neutral-950 border-[#3f3f46] rounded-xl"
    data-v0-t="card"
  >
    <div class="flex flex-col space-y-1.5 p-6">
      <h3 class="text-2xl leading-none text-white font-bold tracking-tight">
        Recent Transactions
      </h3>
    </div>
    <div class="p-6 pt-0">
      <div class="flex flex-col space-y-4">
        <ng-container *ngFor="let transaction of transactions">
          <app-transaction [transaction]="transaction"></app-transaction>
        </ng-container>
      </div>
    </div>
  </div>
</div>
