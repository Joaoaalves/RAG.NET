<div class="flex flex-col md:flex-row gap-4 md:items-end">
  <div class="flex flex-col">
    <label class="text-sm text-neutral-400 mb-1">Start date</label>
    <input
      type="date"
      class="p-2 rounded-md bg-neutral-950 text-white border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-500"
      [value]="startString"
      (change)="onStartChange($event)"
    />
  </div>

  <div class="flex flex-col">
    <label class="text-sm text-neutral-400 mb-1">End date</label>
    <input
      type="date"
      class="p-2 rounded-md bg-neutral-950 text-white border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-500"
      [value]="endString"
      (change)="onEndChange($event)"
    />
  </div>
</div>
