<div class="bg-neutral-950 p-6 rounded-xl border border-neutral-800 space-y-6 shadow-lg">

  <div class="text-center space-y-2">
    <h2 class="text-2xl font-bold text-white">
      Select Date Range
    </h2>
    <p class="text-neutral-400 text-sm">Choose a custom range to filter your wallet activity</p>
  </div>

  <div class="flex flex-col md:flex-row gap-4 items-stretch">
    <div class="flex-1">
      <label class="block text-xs text-neutral-400 mb-1">Start Date</label>
      <input
        class="w-full px-4 py-3 rounded-xl bg-neutral-900 text-white border border-neutral-700 focus:outline-none focus:ring-2 focus:ring-fuchsia-500 transition"
        type="date"
        [value]="startString"
        (change)="onStartChange($event)"
      />
    </div>
    <div class="flex-1">
      <label class="block text-xs text-neutral-400 mb-1">End Date</label>
      <input
        class="w-full px-4 py-3 rounded-xl bg-neutral-900 text-white border border-neutral-700 focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
        type="date"
        [value]="endString"
        (change)="onEndChange($event)"
      />
    </div>
  </div>

  <div *ngIf="validationError" class="text-red-400 text-sm flex items-center gap-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    {{ validationError }}
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      *ngFor="let preset of presets"
      (click)="selectPreset(preset.days)"
      class="px-3 py-1 text-xs rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 hover:text-white transition"
    >
      {{ preset.label }}
    </button>

    <button
      (click)="clear()"
      class="px-3 py-1 text-xs rounded-lg bg-red-500/20 text-red-300 hover:bg-red-500/40 transition flex items-center gap-1"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
      Clear
    </button>
  </div>
</div>
