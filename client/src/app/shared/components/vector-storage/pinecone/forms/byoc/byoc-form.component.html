<div class="flex flex-col gap-6 mt-8 border border-neutral-600 rounded-xl p-4 animate-fade-in-300" [formGroup]="form">
  <!-- API Key -->
  <div>
    <label class="block text-sm font-medium text-white mb-2">API Key</label>
    <input
      type="text"
      formControlName="apiKey"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white placeholder:text-neutral-400"
      placeholder="Enter your Pinecone API Key"
    />
    <p *ngIf="submitted && form.get('apiKey')?.invalid" class="text-sm text-red-500 mt-1">API Key is required.</p>
  </div>

  <!-- Environment -->
  <div>
    <label class="text-white font-medium mb-2 block">Environment</label>
    <input
      type="text"
      formControlName="environment"
      placeholder="e.g., aws-us-east-1-b921"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white outline-none focus:ring-2 ring-fuchsia-500"
    />
    <p *ngIf="submitted && form.get('environment')?.invalid" class="text-sm text-red-500 mt-1">Environment is required.</p>
  </div>

  <!-- Submit -->
  <button
    class="mt-4 w-full py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-sky-500 text-white font-bold uppercase"
    (click)="submit()"
  >
    {{status ? 'Add Vector Storage' : 'Save'}}
  </button>
</div>
