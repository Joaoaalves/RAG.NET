<form class="mt-6 space-y-6 w-full">
  <div>
    <label class="block text-white text-sm font-semibold mb-2">Environment</label>
    <input
      type="text"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white border border-white/10 focus:outline-none focus:border-white/30"
      placeholder="your-env-id"
      [(ngModel)]="environment"
      name="environment"
    />
  </div>

  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pod Type</label>
    <div class="flex gap-3">
      <button
        type="button"
        *ngFor="let type of ['P1', 'P2', 'S1']"
        class="px-4 py-2 rounded-lg text-white font-medium transition-all duration-200 border border-white/10 bg-neutral-900 hover:border-white/30"
        [ngClass]="{ '!bg-gradient-to-r from-fuchsia-500 to-sky-500': podType === type }"
        (click)="podType = type"
      >
        {{ type }}
      </button>
    </div>
  </div>

  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pod Size</label>
    <div class="flex gap-3">
      <button
        type="button"
        *ngFor="let size of ['X1', 'X2', 'X3', 'X4']"
        class="px-4 py-2 rounded-lg text-white font-medium transition-all duration-200 border border-white/10 bg-neutral-900 hover:border-white/30"
        [ngClass]="{ '!bg-gradient-to-r from-fuchsia-500 to-sky-500': podSize === size }"
        (click)="podSize = size"
      >
        {{ size }}
      </button>
    </div>
  </div>

  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pods</label>
    <input
      type="number"
      min="1"
      max="10000"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white border border-white/10 focus:outline-none focus:border-white/30"
      [(ngModel)]="pods"
      name="pods"
    />
  </div>

  <button
    type="submit"
    class="w-full mt-4 bg-gradient-to-r from-fuchsia-500 to-sky-500 py-2 rounded-lg text-white font-semibold hover:opacity-90 transition"
  >
   Save
  </button>
</form>
