<form class="flex flex-col gap-6 mt-8 border border-neutral-600 rounded-xl p-4 animate-fade-in-300" [formGroup]="form">
  <!-- API Key -->
  <div>
    <label class="block text-sm font-medium text-white mb-2">API Key</label>
    <input
      type="text"
      formControlName="apiKey"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white placeholder:text-neutral-400"
      placeholder="Enter your Pinecone API Key"
    />
    <p *ngIf="submitted && form.get('apiKey')?.invalid" class="text-sm text-red-500 mt-1">API Key is required.</p>
  </div>

  <!-- Pod Type -->
  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pod Type</label>
    <div class="flex gap-3">
      <button
        type="button"
        *ngFor="let type of podTypes"
        class="px-4 py-2 rounded-lg text-white font-medium border border-white/10 bg-neutral-900 hover:border-white/30"
        [ngClass]="{ 'bg-gradient-to-r from-fuchsia-500 to-sky-500': podTypeValue === type }"
        (click)="selectPodType(type)"
      >
        {{ type }}
      </button>
    </div>
  </div>

  <!-- Pod Size -->
  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pod Size</label>
    <div class="flex gap-3">
      <button
        type="button"
        *ngFor="let size of podSizes"
        class="px-4 py-2 rounded-lg text-white font-medium border border-white/10 bg-neutral-900 hover:border-white/30"
        [ngClass]="{ 'bg-gradient-to-r from-fuchsia-500 to-sky-500': podSizeValue === size }"
        (click)="selectPodSize(size)"
      >
        {{ size }}
      </button>
    </div>
  </div>

  <!-- Pods -->
  <div>
    <label class="block text-white text-sm font-semibold mb-2">Pods</label>
    <input
      type="number"
      formControlName="pods"
      min="1"
      max="10000"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white border border-white/10 focus:outline-none focus:border-white/30"
    />
    <p *ngIf="submitted && form.get('pods')?.invalid" class="text-sm text-red-500 mt-1">
      Pods must be between 1 and 10000.
    </p>
  </div>

  <!-- Environment -->
  <div>
    <label class="block text-white text-sm font-semibold mb-2">Environment</label>
    <input
      type="text"
      formControlName="environment"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white border border-white/10 focus:outline-none focus:border-white/30"
      placeholder="your-env-id"
    />
    <p *ngIf="submitted && form.get('environment')?.invalid" class="text-sm text-red-500 mt-1">Environment is required.</p>
  </div>

  <!-- Submit -->
  <button
    type="submit"
    (click)="submit()"
    class="w-full mt-4 bg-gradient-to-r from-fuchsia-500 to-sky-500 py-2 rounded-lg text-white font-semibold hover:opacity-90 transition"
  >
    {{status ? 'Add Vector Storage' : 'Save'}}
  </button>
</form>
