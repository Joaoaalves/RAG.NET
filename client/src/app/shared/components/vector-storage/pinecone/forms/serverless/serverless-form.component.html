<form class="flex flex-col gap-6 mt-8 border border-neutral-600 rounded-xl p-4 animate-fade-in-300" [formGroup]="form">
  <!-- API Key -->
  <div>
    <label class="block text-sm font-medium text-white mb-2">API Key</label>
    <input
      type="text"
      formControlName="apiKey"
      class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white placeholder:text-neutral-400"
      placeholder="Enter your Pinecone API Key"
    />
    <p *ngIf="submitted && form.get('apiKey')?.invalid" class="text-sm text-red-500 mt-1">API Key is required.</p>
  </div>

  <!-- Cloud Selector -->
  <div>
    <label class="block text-sm font-medium text-white mb-2">Cloud</label>
    <div class="flex flex-wrap gap-2">
      <button
        *ngFor="let cloud of clouds; index as i"
        type="button"
        (click)="selectCloud(i)"
        class="px-4 py-2 rounded-lg text-sm font-medium text-white border border-white/20"
        [ngClass]="{
          'bg-gradient-to-r from-fuchsia-500 to-sky-500': selectedCloud === i,
          'bg-neutral-800': selectedCloud !== i
        }"
      >
        {{ cloud.toUpperCase() }}
      </button>
    </div>
  </div>

  <!-- Region Selector -->
  <div *ngIf="availableRegions.length">
    <label class="block text-sm font-medium text-white mb-2">Region</label>
    <div class="flex flex-wrap gap-2">
      <button
        *ngFor="let region of availableRegions"
        type="button"
        (click)="selectRegion(region)"
        class="px-4 py-2 rounded-lg text-sm font-medium text-white border border-white/20"
        [ngClass]="{
          'bg-gradient-to-r from-fuchsia-500 to-sky-500': form.get('region')?.value === region,
          'bg-neutral-800': form.get('region')?.value !== region
        }"
      >
        {{ region }}
      </button>
    </div>
    <p *ngIf="submitted && form.get('region')?.invalid" class="text-sm text-red-500 mt-1">Region is required.</p>
  </div>

  <!-- Submit -->
  <div class="mt-6">
    <button
      class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-fuchsia-600 to-sky-600 text-white"
      (click)="submit()"
    >

    {{status ? 'Add Vector Storage' : 'Save'}}
    </button>
  </div>
</form>
