services:
  client-dev:
    container_name: client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["pnpm", "run", "start", "--poll", "200"]

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  migrations:
    build:
      context: ./api
      dockerfile: RAGNet.Infrastructure/Dockerfile
      target: migrations
    depends_on:
      postgres:
        condition: service_started
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
        
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rag_user
      RABBITMQ_DEFAULT_PASS: rag_password
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: bitnami/redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6379:6379"
  api-dev:
    build:
      context: ./api
      dockerfile: web/Dockerfile
      target: dev
    ports:
      - "5000:8080"
    volumes:
      - ./api:/src
      - /src/obj
      - /src/bin
      - /src/RAGNet.Application/obj
      - /src/RAGNet.Application/bin
      - /src/RAGNet.Infrastructure/obj
      - /src/RAGNet.Infrastructure/bin
      - /src/RAGNet.Domain/obj
      - /src/RAGNet.Domain/bin
      - ~/.aspnet/https:/https:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=1
      - CLIENT_URL=http://localhost:4200
      - PRODUCTION=false

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    command: >
      sh -c "echo 'Host=postgres;Port=5432;Database=rag_db;Username=postgres;Password=password' > /pgadmin4/config_local.py && /entrypoint.sh"
      
volumes:
  rabbitmq_data:
  postgres_data:
  qdrant_data:
  pgadmin_data:
